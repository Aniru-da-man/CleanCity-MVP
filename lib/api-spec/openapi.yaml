openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: CleanCity AI - Smart City Management Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard summary
  - name: incidents
    description: Incident management
  - name: detections
    description: AI CCTV detections
  - name: environmental
    description: Environmental intelligence
  - name: predictions
    description: Predictive analytics
  - name: map
    description: Interactive map
  - name: community
    description: Community rewards
  - name: notifications
    description: Notifications
  - name: reports
    description: Reports
  - name: admin
    description: Admin panel

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get overall dashboard summary stats
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /incidents:
    get:
      operationId: listIncidents
      tags: [incidents]
      summary: List all incidents
      parameters:
        - name: status
          in: query
          schema:
            type: ["string", "null"]
        - name: severity
          in: query
          schema:
            type: ["string", "null"]
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of incidents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Incident"
    post:
      operationId: createIncident
      tags: [incidents]
      summary: Create a new incident
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"

  /incidents/stats:
    get:
      operationId: getIncidentStats
      tags: [incidents]
      summary: Get incident statistics
      responses:
        "200":
          description: Incident stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentStats"

  /incidents/{id}:
    get:
      operationId: getIncident
      tags: [incidents]
      summary: Get a single incident
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
    patch:
      operationId: updateIncident
      tags: [incidents]
      summary: Update an incident
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
    delete:
      operationId: deleteIncident
      tags: [incidents]
      summary: Delete an incident
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /detections:
    get:
      operationId: listDetections
      tags: [detections]
      summary: List AI CCTV detections
      parameters:
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
        - name: cameraId
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of detections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Detection"

  /detections/cameras:
    get:
      operationId: listCameras
      tags: [detections]
      summary: List all CCTV cameras
      responses:
        "200":
          description: List of cameras
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Camera"

  /environmental/aqi:
    get:
      operationId: getAqiData
      tags: [environmental]
      summary: Get current AQI and pollution data
      responses:
        "200":
          description: AQI data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AqiData"

  /environmental/weather:
    get:
      operationId: getWeatherData
      tags: [environmental]
      summary: Get current weather data
      responses:
        "200":
          description: Weather data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeatherData"

  /environmental/trends:
    get:
      operationId: getEnvironmentalTrends
      tags: [environmental]
      summary: Get AQI and pollution trends over time
      parameters:
        - name: days
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Environmental trends
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnvironmentalTrendPoint"

  /predictions:
    get:
      operationId: listPredictions
      tags: [predictions]
      summary: List predictive analytics results
      responses:
        "200":
          description: Predictions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prediction"

  /predictions/hotspots:
    get:
      operationId: getPredictionHotspots
      tags: [predictions]
      summary: Get predicted incident hotspots
      responses:
        "200":
          description: Hotspot predictions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Hotspot"

  /predictions/waste-forecast:
    get:
      operationId: getWasteForecast
      tags: [predictions]
      summary: Get waste generation forecast data
      responses:
        "200":
          description: Waste forecast
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WasteForecastPoint"

  /map/markers:
    get:
      operationId: getMapMarkers
      tags: [map]
      summary: Get all map markers for incidents and sensors
      responses:
        "200":
          description: Map markers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MapMarker"

  /community/leaderboard:
    get:
      operationId: getLeaderboard
      tags: [community]
      summary: Get community leaderboard
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /community/badges:
    get:
      operationId: listBadges
      tags: [community]
      summary: List all available badges
      responses:
        "200":
          description: Badges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Badge"

  /community/marketplace:
    get:
      operationId: listMarketplaceRewards
      tags: [community]
      summary: List marketplace reward items
      responses:
        "200":
          description: Marketplace items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketplaceItem"

  /community/profile:
    get:
      operationId: getCommunityProfile
      tags: [community]
      summary: Get current user community profile
      responses:
        "200":
          description: Community profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityProfile"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications
      parameters:
        - name: unreadOnly
          in: query
          schema:
            type: ["boolean", "null"]
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /notifications/read-all:
    patch:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: List generated reports
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"
    post:
      operationId: createReport
      tags: [reports]
      summary: Generate a new report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  /reports/{id}:
    get:
      operationId: getReport
      tags: [reports]
      summary: Get a specific report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get admin panel statistics
      responses:
        "200":
          description: Admin stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all users for admin panel
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"

  /profile:
    get:
      operationId: getProfile
      tags: [dashboard]
      summary: Get current user profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    patch:
      operationId: updateProfile
      tags: [dashboard]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /copilot/chat:
    post:
      operationId: sendCopilotMessage
      tags: [dashboard]
      summary: Send a message to AI Copilot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopilotMessageInput"
      responses:
        "200":
          description: AI Copilot response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success
        - message

    DashboardSummary:
      type: object
      properties:
        totalIncidents:
          type: integer
        resolvedToday:
          type: integer
        activeAlerts:
          type: integer
        avgAqi:
          type: number
        civicPoints:
          type: integer
        camerasOnline:
          type: integer
        incidentsByType:
          type: array
          items:
            $ref: "#/components/schemas/TypeCount"
        weeklyTrend:
          type: array
          items:
            $ref: "#/components/schemas/TrendPoint"
      required:
        - totalIncidents
        - resolvedToday
        - activeAlerts
        - avgAqi
        - civicPoints
        - camerasOnline
        - incidentsByType
        - weeklyTrend

    TypeCount:
      type: object
      properties:
        type:
          type: string
        count:
          type: integer
      required:
        - type
        - count

    TrendPoint:
      type: object
      properties:
        label:
          type: string
        value:
          type: integer
      required:
        - label
        - value

    Incident:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        type:
          type: string
        severity:
          type: string
        status:
          type: string
        location:
          type: string
        lat:
          type: number
        lng:
          type: number
        reportedBy:
          type: string
        assignedTo:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
        resolvedAt:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        cameraId:
          type: ["string", "null"]
      required:
        - id
        - title
        - description
        - type
        - severity
        - status
        - location
        - lat
        - lng
        - reportedBy
        - createdAt
        - updatedAt

    IncidentInput:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        type:
          type: string
        severity:
          type: string
        location:
          type: string
        lat:
          type: number
        lng:
          type: number
      required:
        - title
        - description
        - type
        - severity
        - location
        - lat
        - lng

    IncidentUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        severity:
          type: string
        status:
          type: string
        assignedTo:
          type: string

    IncidentStats:
      type: object
      properties:
        total:
          type: integer
        open:
          type: integer
        inProgress:
          type: integer
        resolved:
          type: integer
        critical:
          type: integer
        high:
          type: integer
        medium:
          type: integer
        low:
          type: integer
        byType:
          type: array
          items:
            $ref: "#/components/schemas/TypeCount"
        byDay:
          type: array
          items:
            $ref: "#/components/schemas/TrendPoint"
      required:
        - total
        - open
        - inProgress
        - resolved
        - critical
        - high
        - medium
        - low
        - byType
        - byDay

    Detection:
      type: object
      properties:
        id:
          type: integer
        cameraId:
          type: string
        cameraName:
          type: string
        type:
          type: string
        confidence:
          type: number
        severity:
          type: string
        location:
          type: string
        lat:
          type: number
        lng:
          type: number
        detectedAt:
          type: string
        thumbnailUrl:
          type: ["string", "null"]
        incidentId:
          type: ["integer", "null"]
      required:
        - id
        - cameraId
        - cameraName
        - type
        - confidence
        - severity
        - location
        - lat
        - lng
        - detectedAt

    Camera:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        location:
          type: string
        lat:
          type: number
        lng:
          type: number
        status:
          type: string
        lastDetection:
          type: ["string", "null"]
        detectionsToday:
          type: integer
        streamUrl:
          type: ["string", "null"]
      required:
        - id
        - name
        - location
        - lat
        - lng
        - status
        - detectionsToday

    AqiData:
      type: object
      properties:
        aqi:
          type: integer
        category:
          type: string
        pm25:
          type: number
        pm10:
          type: number
        o3:
          type: number
        no2:
          type: number
        so2:
          type: number
        co:
          type: number
        updatedAt:
          type: string
        stations:
          type: array
          items:
            $ref: "#/components/schemas/AqiStation"
      required:
        - aqi
        - category
        - pm25
        - pm10
        - o3
        - no2
        - so2
        - co
        - updatedAt
        - stations

    AqiStation:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        aqi:
          type: integer
        lat:
          type: number
        lng:
          type: number
      required:
        - id
        - name
        - aqi
        - lat
        - lng

    WeatherData:
      type: object
      properties:
        temperature:
          type: number
        feelsLike:
          type: number
        humidity:
          type: integer
        windSpeed:
          type: number
        windDirection:
          type: string
        condition:
          type: string
        visibility:
          type: number
        uvIndex:
          type: integer
        updatedAt:
          type: string
      required:
        - temperature
        - feelsLike
        - humidity
        - windSpeed
        - windDirection
        - condition
        - visibility
        - uvIndex
        - updatedAt

    EnvironmentalTrendPoint:
      type: object
      properties:
        date:
          type: string
        aqi:
          type: integer
        pm25:
          type: number
        pm10:
          type: number
        temperature:
          type: number
      required:
        - date
        - aqi
        - pm25
        - pm10
        - temperature

    Prediction:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
        title:
          type: string
        description:
          type: string
        probability:
          type: number
        timeframe:
          type: string
        location:
          type: ["string", "null"]
        severity:
          type: string
        createdAt:
          type: string
      required:
        - id
        - type
        - title
        - description
        - probability
        - timeframe
        - severity
        - createdAt

    Hotspot:
      type: object
      properties:
        id:
          type: integer
        lat:
          type: number
        lng:
          type: number
        location:
          type: string
        riskScore:
          type: number
        type:
          type: string
        predictedIncidents:
          type: integer
      required:
        - id
        - lat
        - lng
        - location
        - riskScore
        - type
        - predictedIncidents

    WasteForecastPoint:
      type: object
      properties:
        week:
          type: string
        predicted:
          type: number
        actual:
          type: ["number", "null"]
        baseline:
          type: number
      required:
        - week
        - predicted
        - baseline

    MapMarker:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
        title:
          type: string
        lat:
          type: number
        lng:
          type: number
        severity:
          type: ["string", "null"]
        status:
          type: string
      required:
        - id
        - type
        - title
        - lat
        - lng
        - status

    LeaderboardEntry:
      type: object
      properties:
        rank:
          type: integer
        userId:
          type: string
        name:
          type: string
        avatar:
          type: ["string", "null"]
        points:
          type: integer
        level:
          type: string
        badges:
          type: integer
        reports:
          type: integer
        change:
          type: integer
      required:
        - rank
        - userId
        - name
        - points
        - level
        - badges
        - reports
        - change

    Badge:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        icon:
          type: string
        category:
          type: string
        pointsRequired:
          type: integer
        rarity:
          type: string
        earnedAt:
          type: ["string", "null"]
        isEarned:
          type: boolean
      required:
        - id
        - name
        - description
        - icon
        - category
        - pointsRequired
        - rarity
        - isEarned

    MarketplaceItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        pointsCost:
          type: integer
        category:
          type: string
        imageUrl:
          type: ["string", "null"]
        stock:
          type: integer
        isAvailable:
          type: boolean
        discount:
          type: ["integer", "null"]
      required:
        - id
        - name
        - description
        - pointsCost
        - category
        - stock
        - isAvailable

    CommunityProfile:
      type: object
      properties:
        userId:
          type: string
        name:
          type: string
        points:
          type: integer
        level:
          type: string
        rank:
          type: integer
        totalUsers:
          type: integer
        reportsSubmitted:
          type: integer
        badgesEarned:
          type: integer
        streakDays:
          type: integer
        joinedAt:
          type: string
        monthlyPoints:
          type: array
          items:
            $ref: "#/components/schemas/TrendPoint"
      required:
        - userId
        - name
        - points
        - level
        - rank
        - totalUsers
        - reportsSubmitted
        - badgesEarned
        - streakDays
        - joinedAt
        - monthlyPoints

    Notification:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
        title:
          type: string
        message:
          type: string
        isRead:
          type: boolean
        priority:
          type: string
        createdAt:
          type: string
        link:
          type: ["string", "null"]
      required:
        - id
        - type
        - title
        - message
        - isRead
        - priority
        - createdAt

    Report:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        type:
          type: string
        status:
          type: string
        period:
          type: string
        generatedAt:
          type: ["string", "null"]
        createdAt:
          type: string
        downloadUrl:
          type: ["string", "null"]
        size:
          type: ["string", "null"]
      required:
        - id
        - title
        - type
        - status
        - period
        - createdAt

    ReportInput:
      type: object
      properties:
        title:
          type: string
        type:
          type: string
        period:
          type: string
        includeAqi:
          type: boolean
        includeIncidents:
          type: boolean
        includePredictions:
          type: boolean
      required:
        - title
        - type
        - period

    AdminStats:
      type: object
      properties:
        totalUsers:
          type: integer
        activeUsers:
          type: integer
        totalIncidents:
          type: integer
        camerasOnline:
          type: integer
        systemHealth:
          type: string
        storageUsed:
          type: number
        apiCallsToday:
          type: integer
        alertsActive:
          type: integer
      required:
        - totalUsers
        - activeUsers
        - totalIncidents
        - camerasOnline
        - systemHealth
        - storageUsed
        - apiCallsToday
        - alertsActive

    AdminUser:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
        status:
          type: string
        lastActive:
          type: string
        points:
          type: integer
        reports:
          type: integer
      required:
        - id
        - name
        - email
        - role
        - status
        - lastActive
        - points
        - reports

    UserProfile:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
        department:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        avatar:
          type: ["string", "null"]
        joinedAt:
          type: string
        lastActive:
          type: string
      required:
        - id
        - name
        - email
        - role
        - joinedAt
        - lastActive

    ProfileUpdate:
      type: object
      properties:
        name:
          type: string
        department:
          type: string
        phone:
          type: string

    CopilotMessageInput:
      type: object
      properties:
        message:
          type: string
        context:
          type: ["string", "null"]
      required:
        - message

    CopilotResponse:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
        suggestions:
          type: array
          items:
            type: string
        createdAt:
          type: string
      required:
        - id
        - message
        - suggestions
        - createdAt
